<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plateau Spatial</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f5f5f3;
  font-family:'DM Sans',sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  display:block;
  filter:blur(0.18px);
}

.ui{
  position:fixed;
  left:8vw;
  top:50%;
  transform:translateY(-50%);
  width:50rem;
  z-index:2;
  pointer-events:none;
}

h1{
  font-size:clamp(44px,5vw,74px);
  line-height:1;
  letter-spacing:-0.02em;
  font-weight:500;
  color:#111;
  white-space:nowrap;
}

.sub{
  margin-top:2rem;
  font-size:14px;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:300;
  color:#9a9a98;
}

.desc{
  width:30rem;
  max-width:30rem;
  margin-top:2rem;
  font-size:13px;
  line-height:1.95;
  font-weight:300;
  color:#666;
  text-align:justify;
  text-justify:inter-word;
}

.cta{
  margin-top:4.4rem;
  display:flex;
  flex-direction:column;
  gap:.7rem;
  align-items:flex-start;
}

.cta a{
  font-size:12px;
  color:#222;
  text-decoration:none;
  border-bottom:1px solid #ddd;
  padding-bottom:2px;
}

.loc{
  font-size:11px;
  color:#bbb;
}

</style>

</head>

<body>

<canvas id="c"></canvas>

<div class="ui">

  <h1>Plateau Spatial</h1>

  <p class="sub">
    Research-Led Spatial Practice
  </p>

  <p class="desc">
    Our work moves across architecture, urban ecosystems,
    and experimental inquiry, tracing the systems and
    conditions that shape how space is made, used,
    and understood.
  </p>

  <div class="cta">

    <a href="mailto:info@plateauspatial.com">
      info@plateauspatial.com
    </a>

    <span class="loc">
      Bengaluru, India
    </span>

  </div>

</div>

<script>

const cv = document.getElementById('c');
const cx = cv.getContext('2d');

function resize(){
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
}

resize();
window.addEventListener('resize', resize);

const mouse = {
  x:-999,
  y:-999,
  tx:-999,
  ty:-999
};

window.addEventListener('mousemove', e => {
  mouse.tx = e.clientX;
  mouse.ty = e.clientY;
});

const SPLINES = [

  {
    pts:[
      [0.00,0.64],
      [0.12,0.72],
      [0.24,0.76],
      [0.38,0.67],
      [0.54,0.64],
      [0.70,0.73],
      [0.84,0.58],
      [0.93,0.28],
      [1.00,0.00]
    ],
    op:0.075,
    lw:1.35,
    r:148,g:148,b:144,
    phase:4.8,
    amp:0.030
  },

  {
    pts:[
      [0.00,0.78],
      [0.10,0.86],
      [0.22,0.74],
      [0.36,0.67],
      [0.52,0.77],
      [0.68,0.84],
      [0.82,0.56],
      [0.91,0.18],
      [1.00,-0.08]
    ],
    op:0.22,
    lw:1.2,
    r:24,g:24,b:24,
    phase:0.0,
    amp:0.060
  },

  {
    pts:[
      [0.00,0.86],
      [0.12,0.92],
      [0.26,0.82],
      [0.42,0.75],
      [0.58,0.83],
      [0.74,0.85],
      [0.86,0.64],
      [0.95,0.24],
      [1.00,0.02]
    ],
    op:0.13,
    lw:0.95,
    r:28,g:28,b:28,
    phase:1.8,
    amp:0.045
  },

  {
    pts:[
      [0.00,0.79],
      [0.14,0.85],
      [0.28,0.77],
      [0.44,0.70],
      [0.62,0.79],
      [0.78,0.76],
      [0.90,0.42],
      [1.00,0.02]
    ],
    op:0.095,
    lw:1.15,
    r:132,g:132,b:128,
    phase:3.1,
    amp:0.032
  },

  {
    pts:[
      [0.00,0.93],
      [0.18,0.96],
      [0.36,0.86],
      [0.56,0.84],
      [0.76,0.82],
      [0.90,0.46],
      [1.00,0.08]
    ],
    op:0.055,
    lw:0.9,
    r:135,g:135,b:130,
    phase:5.4,
    amp:0.022
  }

];

function catmullRom(pts,t){

  const n = pts.length;

  const seg = Math.min(
    Math.floor(t*(n-1)),
    n-2
  );

  const lt = t*(n-1)-seg;

  const p0 = pts[Math.max(seg-1,0)];
  const p1 = pts[seg];
  const p2 = pts[Math.min(seg+1,n-1)];
  const p3 = pts[Math.min(seg+2,n-1)];

  const t2 = lt*lt;
  const t3 = t2*lt;

  return [

    0.5 * (
      (2*p1[0]) +
      (-p0[0]+p2[0])*lt +
      (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 +
      (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3
    ),

    0.5 * (
      (2*p1[1]) +
      (-p0[1]+p2[1])*lt +
      (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 +
      (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3
    )

  ];
}

function frame(now){

  requestAnimationFrame(frame);

  const W = cv.width;
  const H = cv.height;

  const t = now * 0.001;

  mouse.x += (mouse.tx - mouse.x) * 0.035;
  mouse.y += (mouse.ty - mouse.y) * 0.035;

  cx.clearRect(0,0,W,H);

  const STEPS = 520;
  const fieldRadius = W * 0.95;

  for(const def of SPLINES){

    cx.beginPath();

    for(let i=0;i<=STEPS;i++){

      const s = i / STEPS;

      let [u,v] = catmullRom(def.pts,s);

      const waveA =
        Math.sin(
          (s * 7.5) -
          (t * 2.8) +
          def.phase
        );

      const waveB =
        Math.cos(
          (s * 3.2) +
          (t * 2.1) +
          def.phase * 0.6
        );

      const waveC =
        Math.sin(
          (s * 15.0) -
          (t * 3.4)
        );

      const envelope =
        Math.pow(s,1.05);

      const flow =
        (
          waveA * 0.52 +
          waveB * 0.33 +
          waveC * 0.15
        )
        *
        def.amp
        *
        envelope;

      v += Math.max(
        Math.min(flow, 0.11),
        -0.11
      );

      let px = u * W;
      let py = v * H;

      const dx = px - mouse.x;
      const dy = py - mouse.y;

      const dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < fieldRadius){

        const falloff =
          Math.pow(
            1 - (dist / fieldRadius),
            2.8
          );

        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        const directional =
          Math.cos(
            dy * 0.002
          );

        const force =
          falloff *
          directional *
          90;

        px += nx * force;
        py += ny * force * 0.45;
      }

      if(i===0){
        cx.moveTo(px,py);
      }else{
        cx.lineTo(px,py);
      }
    }

    cx.shadowBlur = 18;

    cx.shadowColor =
      `rgba(${def.r},${def.g},${def.b},${def.op * 0.22})`;

    cx.strokeStyle =
      `rgba(${def.r},${def.g},${def.b},${def.op})`;

    cx.lineWidth = def.lw;

    cx.stroke();

    cx.shadowBlur = 0;
  }
}

requestAnimationFrame(frame);

</script>

</body>
</html>
